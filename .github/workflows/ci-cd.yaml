name: Java CI with Maven - Reservation Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ticket-booking-system/reservation-service/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ticket-booking-system/reservation-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout koda
      uses: actions/checkout@v4

    - name: Setuj Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Dodaj izvršna prava za mvnw
      run: chmod +x ticket-booking-system/reservation-service/mvnw

    - name: Build i Pokretanje Testova
      working-directory: ./ticket-booking-system/reservation-service
      run: mvn clean test